[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-analysis"
version = "0.0.0"
description = "Git repository analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gitpython>=3.1.45",
    "matplotlib>=3.10.9",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "perceval>=1.4.1"
]

[project.scripts]
repo-analysis = "cli:main"
